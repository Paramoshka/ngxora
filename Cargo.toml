[package]
name = "ngxora"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".",
    "crates/ngxora-config",
    "crates/ngxora-compile",
    "crates/ngxora-runtime",
    "crates/ngxora-plugin-api",
    "crates/ngxora-plugin-registry",
    "crates/extensions/*",
]

[features]
default = ["plugin-headers", "plugin-basic-auth", "plugin-rate-limit", "plugin-cors", "plugin-ext-authz", "plugin-jwt-auth"]
plugin-headers = ["ngxora-runtime/plugin-headers"]
plugin-basic-auth = ["ngxora-runtime/plugin-basic-auth"]
plugin-rate-limit = ["ngxora-runtime/plugin-rate-limit"]
plugin-cors = ["ngxora-runtime/plugin-cors"]
plugin-ext-authz = ["ngxora-runtime/plugin-ext-authz"]
plugin-jwt-auth = ["ngxora-runtime/plugin-jwt-auth"]

[dependencies]
arc-swap = "1.8.2"
dashmap = "6"
env_logger = "0.11"
ngxora-config = {path = "crates/ngxora-config"}
ngxora-compile = {path = "crates/ngxora-compile"}
ngxora-runtime = {path = "crates/ngxora-runtime"}
pingora = { version = "0.8.1", default-features = false, features = ["lb", "openssl"] }
pingora-proxy = { version = "0.8.1", default-features = false, features = ["openssl"] }
pingora-cache = "0.8.1"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }

[[bin]]
name = "ngxora"
bench = false
path = "crates/ngxora-cli/src/main.rs"

[dev-dependencies]
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost"] }
tower = "0.5"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = "0.14"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-rustls = "0.26"
