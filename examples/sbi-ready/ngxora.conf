http {
    keepalive_timeout 60s;
    keepalive_requests 10000;
    tcp_nodelay on;

    upstream sbi_pool {
        policy consistent_hash;
        hash_key header X-Tenant-ID;
        server 10.20.0.11:8443 weight=3;
        server 10.20.0.12:8443 weight=1;

        health_check {
            type tcp;
            timeout 1s;
            interval 5s;
            consecutive_success 1;
            consecutive_failure 2;
        }
    }

    server {
        listen 8080 default_server;
        server_name sbi-proxy.internal;

        location / {
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_write_timeout 30s;
            proxy_upstream_protocol h2;

            # Enable these four directives with real PEM files in deployment.
            # proxy_ssl_verify on;
            # proxy_ssl_trusted_certificate /etc/ngxora/sbi/ca.pem;
            # proxy_ssl_certificate /etc/ngxora/sbi/client.crt;
            # proxy_ssl_certificate_key /etc/ngxora/sbi/client.key;

            proxy_pass https://sbi_pool;
        }
    }
}
