http {
    keepalive_timeout 60s;
    keepalive_requests 10000;
    tcp_nodelay on;

    upstream smf_pool {
        policy round_robin;

        nrf_discovery {
            api_root https://nrf.nrf.svc.cluster.local/nnrf-disc/v1;
            target_nf_type SMF;
            requester_nf_type SCP;
            service_name nsmf-pdusession;
            endpoint_scheme https;
            timeout 3s;
            stale_if_error 60s;

            ssl_verify on;
            # ssl_trusted_certificate /etc/ngxora/nrf/ca.pem;
            # ssl_certificate /etc/ngxora/nrf/client.crt;
            # ssl_certificate_key /etc/ngxora/nrf/client.key;
        }

        health_check {
            type tcp;
            timeout 1s;
            interval 5s;
            consecutive_success 1;
            consecutive_failure 2;
        }
    }

    server {
        listen 8080 default_server;
        server_name sbi-proxy.internal;

        location / {
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_write_timeout 30s;
            proxy_upstream_protocol h2;

            # Configure producer trust and identity independently from NRF TLS.
            # proxy_ssl_verify on;
            # proxy_ssl_trusted_certificate /etc/ngxora/sbi/ca.pem;
            # proxy_ssl_certificate /etc/ngxora/sbi/client.crt;
            # proxy_ssl_certificate_key /etc/ngxora/sbi/client.key;

            proxy_pass https://smf_pool;
        }
    }
}
