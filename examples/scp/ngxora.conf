# Local lab only. Use TLS/mTLS for a real deployment; see docs/scp.md.
http {
    h2c on;
    client_max_body_size 10m;

    upstream smf {
        policy round_robin;
        nrf_discovery {
            api_root http://127.0.0.1:7777/nnrf-disc/v1;
            target_nf_type SMF;
            requester_nf_type AMF;
            service_name nsmf-pdusession;
            endpoint_scheme http;
            timeout 3s;
            stale_if_error 10s;
        }
        health_check {
            type tcp;
            timeout 1s;
            interval 5s;
            consecutive_success 1;
            consecutive_failure 2;
        }
    }

    scp core {
        api_root http://127.0.0.1:8080/scp;
        discovery_upstream smf;
        # Explicit destination for direct routing and callbacks.
        allow_target_api_root http://127.0.0.1:9000/operator/edge;
    }

    server {
        listen 127.0.0.1:8080;
        location /scp/ {
            scp_pass core;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_write_timeout 30s;
        }
    }
}
