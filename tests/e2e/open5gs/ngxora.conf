http {
  h2c on;
  upstream smf_pool {
    nrf_discovery {
      api_root http://nrf:7777/nnrf-disc/v1;
      target_nf_type SMF;
      requester_nf_type SCP;
      service_name nsmf-pdusession;
      endpoint_scheme http;
      timeout 3s;
      stale_if_error 10s;
    }

    health_check {
      type http;
      path /health;
      host producer.test;
      timeout 1s;
      interval 1s;
      consecutive_success 1;
      consecutive_failure 1;
    }
  }

  scp core {
    api_root http://ngxora:8080/scp;
    discovery_upstream smf_pool;
  }

  # H2 frontends for the HTTP/1-only mock producers, not additional SCP hops.
  server {
    listen 0.0.0.0:8081;
    location / { proxy_connect_timeout 1s; proxy_pass http://10.248.73.20:8080; }
  }
  server {
    listen 0.0.0.0:8082;
    location / { proxy_connect_timeout 1s; proxy_pass http://10.248.73.21:8080; }
  }
  server {
    listen 0.0.0.0:8083;
    location / { proxy_connect_timeout 1s; proxy_pass http://10.248.73.22:8080; }
  }

  server {
    listen 0.0.0.0:8080 default_server;
    location /scp/ { scp_pass core; }
    location / {
      proxy_pass http://smf_pool;
    }
  }
}
