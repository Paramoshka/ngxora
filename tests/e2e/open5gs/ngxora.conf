http {
  upstream smf_pool {
    nrf_discovery {
      api_root http://nrf:7777/nnrf-disc/v1;
      target_nf_type SMF;
      requester_nf_type SCP;
      service_name nsmf-pdusession;
      endpoint_scheme http;
      timeout 3s;
      stale_if_error 10s;
    }

    health_check {
      type tcp;
      timeout 1s;
      interval 1s;
      consecutive_success 1;
      consecutive_failure 1;
    }
  }

  server {
    listen 0.0.0.0:8080 default_server;
    location / {
      proxy_pass http://smf_pool;
    }
  }
}
