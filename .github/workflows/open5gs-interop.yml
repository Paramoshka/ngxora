name: Open5GS interoperability

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open5gs-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Open5GS NRF interoperability test
        run: make test-open5gs

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: open5gs-interop-logs
          path: /tmp/ngxora-open5gs-interop.log
          if-no-files-found: ignore
